<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octopus Tools — Password Generator</title>
  <link rel="stylesheet" href="/styles/main.css?v=964ccf06" />
  <link rel="icon" href="/images/favicon.ico" />
  <style>
    .tool-section { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .mode-tab {
      background: var(--bg-3); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 8px; padding: 8px 16px;
      font-size: 0.85rem; cursor: pointer; transition: 0.15s;
    }
    .mode-tab.active { border-color: var(--accent); color: var(--text); background: var(--bg-2); }

    .output-box {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .output-value {
      flex: 1; font-family: 'Courier New', monospace; font-size: 1.1rem;
      color: var(--text); word-break: break-all; line-height: 1.5;
    }
    .output-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn {
      background: var(--bg-3); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 6px;
      padding: 8px 14px; font-size: 0.8rem; cursor: pointer;
      white-space: nowrap; transition: 0.15s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--text); }
    .icon-btn.copied { border-color: #4caf50; color: #4caf50; }

    .strength-meter {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
      font-size: 0.85rem; color: var(--text-muted);
    }
    .strength-bar {
      flex: 1; height: 6px; background: var(--bg-3); border-radius: 3px;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%; transition: width 0.2s, background 0.2s;
      background: var(--accent);
    }
    .strength-label { white-space: nowrap; }

    .controls { display: grid; gap: 20px; }
    .control-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .control-row label { color: var(--text-muted); font-size: 0.85rem; min-width: 120px; }

    .length-slider { flex: 1; }
    .length-value {
      font-family: 'Courier New', monospace; font-size: 1rem;
      color: var(--text); min-width: 40px; text-align: right;
    }

    .checkbox-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 18px;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      color: var(--text); font-size: 0.9rem;
    }
    .checkbox-label input { cursor: pointer; }

    .section-label {
      font-size: 0.75rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand">🐙 Octopus Tools</a>
      <nav>
        <a href="/" class="nav-link">Home</a>
        <a href="/speed-reader.html" class="nav-link">Speed Reader</a>
        <a href="/hash.html" class="nav-link">Hash</a>
        <a href="/baseconv.html" class="nav-link">Base Conv</a>
        <a href="/password-generator.html" class="nav-link active">Password</a>
      </nav>
    </div>
  </header>

  <section class="tool-section">
    <h1 style="margin:0 0 8px;">Password Generator</h1>
    <p style="color:var(--text-muted); margin:0 0 24px; font-size:0.9rem;">
      Generated with <code>crypto.getRandomValues</code> — never leaves your browser.
    </p>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="password">Password</button>
      <button class="mode-tab" data-mode="passphrase">Passphrase</button>
      <button class="mode-tab" data-mode="pin">PIN</button>
    </div>

    <div class="output-box">
      <div class="output-value" id="output">click generate</div>
      <div class="output-actions">
        <button class="icon-btn" id="copyBtn">Copy</button>
        <button class="icon-btn" id="regenBtn">↻</button>
      </div>
    </div>

    <div class="strength-meter">
      <span class="strength-label" id="strengthLabel">—</span>
      <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill" style="width:0%"></div></div>
      <span class="strength-label" id="entropyLabel">— bits</span>
    </div>

    <!-- ── Password mode ────────────────────────────────────────────────── -->
    <div class="controls" id="passwordControls">
      <div class="control-row">
        <label for="length">Length</label>
        <input type="range" id="length" class="length-slider" min="8" max="64" value="20" />
        <span class="length-value" id="lengthValue">20</span>
      </div>

      <div>
        <div class="section-label">Character sets</div>
        <div class="checkbox-row">
          <label class="checkbox-label"><input type="checkbox" id="useLower" checked /> a-z (lowercase)</label>
          <label class="checkbox-label"><input type="checkbox" id="useUpper" checked /> A-Z (uppercase)</label>
          <label class="checkbox-label"><input type="checkbox" id="useDigits" checked /> 0-9 (digits)</label>
          <label class="checkbox-label"><input type="checkbox" id="useSymbols" checked /> !@#$ (symbols)</label>
          <label class="checkbox-label"><input type="checkbox" id="noAmbig" /> Exclude ambiguous (l, 1, I, O, 0)</label>
        </div>
      </div>
    </div>

    <!-- ── Passphrase mode ──────────────────────────────────────────────── -->
    <div class="controls hidden" id="passphraseControls">
      <div class="control-row">
        <label for="wordCount">Words</label>
        <input type="range" id="wordCount" class="length-slider" min="3" max="10" value="5" />
        <span class="length-value" id="wordCountValue">5</span>
      </div>

      <div class="control-row">
        <label for="separator">Separator</label>
        <select id="separator" style="background:var(--bg-3); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px;">
          <option value="-">- (hyphen)</option>
          <option value=".">. (dot)</option>
          <option value="_">_ (underscore)</option>
          <option value=" ">(space)</option>
          <option value="">(none)</option>
        </select>
      </div>

      <div>
        <div class="section-label">Options</div>
        <div class="checkbox-row">
          <label class="checkbox-label"><input type="checkbox" id="capitalize" checked /> Capitalize first letter of each word</label>
          <label class="checkbox-label"><input type="checkbox" id="addNumber" /> Append a random number</label>
        </div>
      </div>
    </div>

    <!-- ── PIN mode ──────────────────────────────────────────────────────── -->
    <div class="controls hidden" id="pinControls">
      <div class="control-row">
        <label for="pinLength">Digits</label>
        <input type="range" id="pinLength" class="length-slider" min="4" max="12" value="6" />
        <span class="length-value" id="pinLengthValue">6</span>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <a href="https://octopustechnology.net" target="_blank" rel="noopener">Octopus Technology</a>
  </footer>

  <script>
    // ─── CSPRNG helpers ────────────────────────────────────────────────────
    function randInt(maxExclusive) {
      // Uniform random integer in [0, maxExclusive) using crypto.getRandomValues.
      // Rejection-sampled to avoid modulo bias.
      const range = 0x100000000; // 2^32
      const limit = range - (range % maxExclusive);
      const buf = new Uint32Array(1);
      let n;
      do { crypto.getRandomValues(buf); n = buf[0]; } while (n >= limit);
      return n % maxExclusive;
    }
    function pick(arr) { return arr[randInt(arr.length)]; }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ─── Character sets ───────────────────────────────────────────────────
    const LOWER     = 'abcdefghijklmnopqrstuvwxyz';
    const UPPER     = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const DIGITS    = '0123456789';
    const SYMBOLS   = '!@#$%^&*()-_=+[]{};:,.<>/?';
    const AMBIGUOUS = new Set(['l','1','I','O','0','o']);

    // ─── Mini wordlist (subset of EFF short — ~1k words; 10 bits/word) ───
    // For production-grade diceware, this should be the full 7776-word EFF
    // long list. This short list gives ~10 bits/word, plenty for personal use.
    const WORDS = ['able','acid','aged','also','area','army','away','baby','back','ball','band','bank','base','bath','bear','beat','been','beer','bell','belt','best','bike','bird','blow','blue','boat','body','bone','book','boom','born','boss','both','bowl','bulk','burn','bush','busy','call','calm','came','camp','card','care','case','cash','cast','cell','chat','chip','city','club','coal','coat','code','cold','come','cook','cool','cope','copy','core','cost','crew','crop','dark','data','date','dawn','days','dead','deal','dean','dear','debt','deep','deny','desk','dial','dick','diet','disc','disk','does','done','door','dose','down','draw','drew','drop','drug','dual','duke','dust','duty','each','earn','ease','east','easy','edge','else','even','ever','evil','exit','face','fact','fail','fair','fall','farm','fast','fate','fear','feed','feel','feet','fell','felt','file','fill','film','find','fine','fire','firm','fish','five','flat','flow','food','foot','ford','form','fort','four','free','from','fuel','full','fund','gain','game','gate','gave','gear','gene','gift','girl','give','glad','goal','goes','gold','golf','gone','good','gray','grew','grey','grow','gulf','hair','half','hall','hand','hang','hard','harm','hate','have','head','hear','heat','held','hell','help','here','hero','high','hill','hire','hold','hole','holy','home','hope','host','hour','huge','hung','hunt','hurt','idea','inch','into','iron','item','jack','jane','jean','john','join','jump','jury','just','keep','kent','kept','kick','kill','kind','king','knee','knew','know','lack','lady','laid','lake','land','lane','last','late','lead','left','less','life','lift','like','line','link','list','live','load','loan','lock','logo','long','look','lord','lose','loss','lost','love','luck','made','mail','main','make','male','many','mark','mass','matt','meal','mean','meat','meet','menu','mere','mike','mile','milk','mill','mind','mine','miss','mode','mood','moon','more','most','move','much','must','name','navy','near','neck','need','news','next','nice','nick','nine','none','nose','note','okay','once','only','onto','open','oral','over','pace','pack','page','paid','pain','pair','palm','park','part','pass','past','path','peak','pick','pink','pipe','plan','play','plot','plug','plus','poll','pool','poor','port','post','pull','pure','push','race','rail','rain','rank','rare','rate','read','real','rear','rely','rent','rest','rice','rich','ride','ring','rise','risk','road','rock','role','roll','roof','room','root','rose','rule','rush','ruth','safe','said','sake','sale','salt','same','sand','save','seat','seed','seek','seem','seen','self','sell','send','sent','sept','ship','shop','shot','show','shut','sick','side','sign','site','size','skin','slip','slow','snow','soft','soil','sold','sole','some','song','soon','sort','soul','spot','star','stay','step','stop','such','suit','sure','take','tale','talk','tall','tank','tape','task','team','tech','tell','tend','term','test','text','than','that','them','then','they','thin','this','thus','tied','time','tiny','told','toll','tone','tony','took','tool','tour','town','tree','trip','true','tune','turn','twin','type','unit','upon','used','user','vary','vast','very','vice','view','vote','wage','wait','wake','walk','wall','want','ward','warm','wash','wave','ways','weak','wear','week','well','went','were','west','what','when','whom','wide','wife','wild','will','wind','wine','wing','wire','wise','wish','with','wood','word','wore','work','yard','yeah','year','your','zero','zone'];

    // ─── Generators ───────────────────────────────────────────────────────
    function genPassword(length, sets, excludeAmbig) {
      let pool = sets.join('');
      if (excludeAmbig) pool = [...pool].filter(c => !AMBIGUOUS.has(c)).join('');
      if (!pool.length) return '';
      // Ensure at least one char from each enabled set
      const required = sets.map(s => {
        let cs = excludeAmbig ? [...s].filter(c => !AMBIGUOUS.has(c)) : [...s];
        return cs.length ? pick(cs) : '';
      }).filter(Boolean);
      const remaining = Array.from({ length: length - required.length }, () => pick([...pool]));
      return shuffle([...required, ...remaining]).join('');
    }

    function genPassphrase(words, sep, cap, addNum) {
      const out = Array.from({ length: words }, () => {
        const w = pick(WORDS);
        return cap ? w[0].toUpperCase() + w.slice(1) : w;
      });
      let s = out.join(sep);
      if (addNum) s += sep + randInt(100);
      return s;
    }

    function genPin(digits) {
      return Array.from({ length: digits }, () => randInt(10)).join('');
    }

    // ─── Strength estimation (bits of entropy) ────────────────────────────
    function entropyBits(value, mode, opts) {
      if (!value) return 0;
      if (mode === 'pin') return Math.log2(10) * value.length;
      if (mode === 'passphrase') {
        // log2(wordlist size) * wordcount, plus number if appended
        const wl = WORDS.length;
        let bits = Math.log2(wl) * opts.words;
        if (opts.addNumber) bits += Math.log2(100);
        return bits;
      }
      // password
      let poolSize = 0;
      if (opts.lower)   poolSize += opts.excludeAmbig ? LOWER.length   - 2 : LOWER.length;
      if (opts.upper)   poolSize += opts.excludeAmbig ? UPPER.length   - 2 : UPPER.length;
      if (opts.digits)  poolSize += opts.excludeAmbig ? DIGITS.length  - 2 : DIGITS.length;
      if (opts.symbols) poolSize += SYMBOLS.length;
      return poolSize > 1 ? Math.log2(poolSize) * value.length : 0;
    }
    function strengthLabel(bits) {
      if (bits < 28)  return { text: 'Very weak',  color: '#f44336' };
      if (bits < 36)  return { text: 'Weak',       color: '#ff9800' };
      if (bits < 60)  return { text: 'Reasonable', color: '#ffeb3b' };
      if (bits < 80)  return { text: 'Strong',     color: '#8bc34a' };
      return            { text: 'Very strong',     color: '#4caf50' };
    }

    // ─── UI wiring ────────────────────────────────────────────────────────
    let mode = 'password';
    const $ = id => document.getElementById(id);

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        mode = tab.dataset.mode;
        $('passwordControls').classList.toggle('hidden', mode !== 'password');
        $('passphraseControls').classList.toggle('hidden', mode !== 'passphrase');
        $('pinControls').classList.toggle('hidden', mode !== 'pin');
        regenerate();
      });
    });

    function regenerate() {
      let value = '', bits = 0;
      if (mode === 'password') {
        const sets = [];
        if ($('useLower').checked)   sets.push(LOWER);
        if ($('useUpper').checked)   sets.push(UPPER);
        if ($('useDigits').checked)  sets.push(DIGITS);
        if ($('useSymbols').checked) sets.push(SYMBOLS);
        if (!sets.length) { value = '(select at least one character set)'; }
        else {
          value = genPassword(+$('length').value, sets, $('noAmbig').checked);
          bits = entropyBits(value, mode, {
            lower: $('useLower').checked, upper: $('useUpper').checked,
            digits: $('useDigits').checked, symbols: $('useSymbols').checked,
            excludeAmbig: $('noAmbig').checked,
          });
        }
      } else if (mode === 'passphrase') {
        value = genPassphrase(
          +$('wordCount').value, $('separator').value,
          $('capitalize').checked, $('addNumber').checked,
        );
        bits = entropyBits(value, mode, { words: +$('wordCount').value, addNumber: $('addNumber').checked });
      } else {
        value = genPin(+$('pinLength').value);
        bits = entropyBits(value, mode);
      }
      $('output').textContent = value;
      const s = strengthLabel(bits);
      $('strengthLabel').textContent = s.text;
      $('strengthFill').style.width = Math.min(100, (bits / 100) * 100) + '%';
      $('strengthFill').style.background = s.color;
      $('entropyLabel').textContent = bits.toFixed(0) + ' bits';
    }

    // Slider live values
    ['length','wordCount','pinLength'].forEach(id => {
      const el = $(id);
      if (!el) return;
      const out = $(id + 'Value');
      el.addEventListener('input', () => { out.textContent = el.value; regenerate(); });
    });
    // Checkboxes / selects
    document.querySelectorAll('#passwordControls input[type=checkbox], #passphraseControls input, #passphraseControls select')
      .forEach(el => el.addEventListener('change', regenerate));

    // Buttons
    $('regenBtn').addEventListener('click', regenerate);
    $('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('output').textContent);
        $('copyBtn').textContent = 'Copied';
        $('copyBtn').classList.add('copied');
        setTimeout(() => { $('copyBtn').textContent = 'Copy'; $('copyBtn').classList.remove('copied'); }, 1200);
      } catch { /* clipboard not available */ }
    });

    // Initial render
    regenerate();
  </script>
</body>
</html>
