# Cache policy for a hand-maintained static site.
#
# The origin previously sent no cache headers at all, so Cloudflare applied its
# own default — four hours on CSS/JS. A deployed fix was therefore invisible for
# up to four hours while the container was already serving the new file, which
# looks exactly like "the deploy didn't work".
#
# There is no build step here, so filenames are not content-hashed and we can't
# use immutable long-lived caching. Short TTLs plus revalidation is the honest
# trade: a deploy is live within minutes, at the cost of a cheap 304 per asset.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML must never be stale — it is what points at everything else.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
  }
  location = / {
    add_header Cache-Control "no-cache" always;
  }

  # Deploy verification. Written into the image by the Dockerfile as a hash of
  # every served file, because there is no application process here to compute
  # one at startup. It must NEVER be cached: a cached deploy-check answers for
  # the deploy before the one you are asking about, which is worse than no check
  # at all.
  location = /api/build {
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Assets: cacheable, but revalidated often enough that a deploy shows up
  # without anyone purging a CDN by hand.
  #
  # This is the origin's TTL, and it is only half the story — Cloudflare's edge
  # is what a visitor actually talks to, and it caches CSS and JS for four hours
  # regardless of what we send. The real fix is on the URL: every page now links
  # main.css?v=<content hash> (tools/stamp-assets.mjs), so a changed file is a
  # changed URL and the cache is sidestepped rather than negotiated with. This
  # block stays as the second line of defence for anything reaching the bare
  # path.
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # Images/fonts change rarely and are usually replaced rather than edited.
  location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
